    <!-- Google Fonts: Fredoka y Nunito para máxima legibilidad infantil -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Fredoka', 'sans-serif'],
                        body: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }

    <style>
        /* Estilos base optimizados para tablet táctil */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Nunito', sans-serif;
            overflow-x: hidden;
            background-color: #0f172a;
        }

        h1, h2, h3, .font-display {
            font-family: 'Fredoka', sans-serif;
        }

        /* Efecto de botón táctil 3D */
        .btn-tactile {
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.1s ease;
        }
        .btn-tactile:active {
            transform: translateY(4px) scale(0.98);
        }

        /* Animaciones personalizadas */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 3.5s ease-in-out infinite;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Temas visuales por mundo */
        .theme-blocks {
            background: radial-gradient(circle at top right, #1e3a2f, #0f1f18 70%);
        }
        .theme-trainers {
            background: radial-gradient(circle at top right, #450a0a, #1c1917 70%);
        }
        .theme-dragon {
            background: radial-gradient(circle at top right, #3b0764, #1e1b4b 70%);
        }
        .theme-magic {
            background: radial-gradient(circle at top right, #172554, #090d16 70%);
        }
        .theme-hub {
            background: radial-gradient(circle at top, #1e293b, #090d16 80%);
        }

        /* Partículas de celebración */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: particleFly 1s ease-out forwards;
        }
        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(360deg); opacity: 0; }
        }

        /* Barra de desplazamiento limpia */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
        }
    </style>
</head>

    <script>
        /**
         * MOTOR DE AUDIO SINTETIZADO Y LOCUCIÓN EN ESPAÑOL
         */
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            speak(text) {
                if (!this.enabled || !('speechSynthesis' in window)) return;
                try {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-ES';
                    utterance.rate = 0.92;
                    utterance.pitch = 1.08;
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    console.warn('Síntesis de voz no disponible', e);
                }
            }

            playTap() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(780, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playSuccess() {
                if (!this.enabled) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // Do5, Mi5, Sol5, Do6
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    const start = this.ctx.currentTime + i * 0.07;
                    osc.frequency.setValueAtTime(freq, start);
                    gain.gain.setValueAtTime(0.18, start);
                    gain.gain.exponentialRampToValueAtTime(0.01, start + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(start);
                    osc.stop(start + 0.25);
                });
            }

            playError() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playTrophy() {
                if (!this.enabled) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    const start = this.ctx.currentTime + i * 0.1;
                    osc.frequency.setValueAtTime(freq, start);
                    gain.gain.setValueAtTime(0.2, start);
                    gain.gain.exponentialRampToValueAtTime(0.01, start + 0.35);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(start);
                    osc.stop(start + 0.35);
                });
            }
        }

        ];

        /**
         * APLICACIÓN PRINCIPAL
         */
        class AventuraApp {
            constructor() {
                this.storageKey = 'alfonso_ortografia_v1';
                this.state = this.loadState();
                this.currentView = 'hub'; // 'hub' | 'play' | 'summary'
                this.activeWorld = null;
                this.sessionQuestions = [];
                this.currentIndex = 0;
                this.sessionCorrect = 0;
                this.selectedOrderWords = [];
                this.hasAnsweredCurrent = false;
                this.wheelRotation = 0;
                this.wheelSpinning = false;
                this.wheelSpunForSession = false;

                sfx.enabled = this.state.sound;
                this.updateHeader();
                this.renderHub();
            }

            loadState() {
                try {
                    const saved = localStorage.getItem(this.storageKey);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (!parsed.missionRewards) parsed.missionRewards = [];
                        if (!parsed.wheelVouchers) parsed.wheelVouchers = [];
                        return parsed;
                    }
                } catch (e) {
                    console.warn('No se pudo cargar progreso previo', e);
                }
                return {
                    stars: 0,
                    streak: 0,
                    bestStreak: 0,
                    completedIds: [],
                    failedIds: [],
                    unlockedTrophies: [],
                    missionRewards: [],
                    wheelVouchers: [],
                    sound: true
                };
            }

            saveState() {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.state));
                } catch (e) {
                    console.warn('No se pudo guardar el progreso', e);
                }
                this.updateHeader();
            }

            toggleSound() {
                this.state.sound = !this.state.sound;
                sfx.enabled = this.state.sound;
                if (sfx.enabled) sfx.playTap();
                this.saveState();
            }

            updateHeader() {
                document.getElementById('header-streak').textContent = this.state.streak;
                document.getElementById('header-stars').textContent = this.state.stars;
                document.getElementById('header-trophy-count').textContent = `${this.state.unlockedTrophies.length}/${TROPHIES_DATA.length}`;
                document.getElementById('btn-sound').textContent = this.state.sound ? '🔊' : '🔇';
            }

            setBodyTheme(themeClass) {
                document.body.className = `text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-400 selection:text-slate-900 ${themeClass}`;
            }

            goHome() {
                sfx.playTap();
                this.currentView = 'hub';
                this.activeWorld = null;
                this.renderHub();
            }

            /**
             * VISTA 1: MAPA CENTRAL DE MUNDOS
             */
            renderHub() {
                this.setBodyTheme('theme-hub');
                const container = document.getElementById('app-container');

                const totalQuestions = WORLDS_DATA.reduce((acc, w) => acc + w.questions.length, 0);
                const totalDone = this.state.completedIds.length;
                const globalPercent = Math.round((totalDone / totalQuestions) * 100);

                let worldsHtml = WORLDS_DATA.map(world => {
                    const doneInWorld = world.questions.filter(q => this.state.completedIds.includes(q.id)).length;
                    const totalInWorld = world.questions.length;
                    const pct = Math.round((doneInWorld / totalInWorld) * 100);

                    return `
                        <div onclick="app.startWorld('${world.id}')" class="btn-tactile cursor-pointer rounded-3xl bg-gradient-to-br ${world.cardGradient} border-2 p-6 flex flex-col justify-between shadow-xl transition-all">
                            <div>
                                <div class="flex items-start justify-between gap-4 mb-4">
                                    <div class="w-16 h-16 rounded-2xl bg-slate-950/60 border border-white/10 flex items-center justify-center shadow-inner animate-float">
                                        ${world.iconSvg}
                                    </div>
                                    <span class="px-3 py-1 rounded-full text-xs font-extrabold border ${world.badgeBg}">
                                        ${doneInWorld} / ${totalInWorld} retos
                                    </span>
                                </div>
                                <h3 class="font-display text-2xl font-bold text-white mb-1">${world.title}</h3>
                                <p class="text-slate-300 text-sm md:text-base font-semibold mb-5">${world.subtitle}</p>
                            </div>

                            <div>
                                <!-- Barra de progreso del mundo -->
                                <div class="w-full h-3 bg-slate-950/70 rounded-full overflow-hidden mb-4 border border-white/5">
                                    <div class="h-full bg-gradient-to-r from-amber-400 to-emerald-400 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                                </div>
                                <button class="w-full py-3.5 rounded-2xl bg-gradient-to-b ${world.btnClass} font-display font-bold text-lg shadow-lg border-b-4 flex items-center justify-center gap-2">
                                    <span>¡Entrar a jugar!</span>
                                    <span>➔</span>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

                // Botón especial de Repaso Inteligente si tiene preguntas falladas o quiere mezcla
                const hasFailed = this.state.failedIds.length > 0;

                container.innerHTML = `
                    <div class="animate-pop">
                        <!-- Banner de Bienvenida -->
                        <div class="bg-slate-900/70 border border-white/10 rounded-3xl p-5 md:p-7 mb-7 flex flex-col md:flex-row items-center justify-between gap-6 shadow-xl">
                            <div class="text-center md:text-left">
                                <span class="inline-block px-3 py-1 rounded-full bg-amber-400/15 text-amber-300 text-xs font-extrabold uppercase tracking-wider mb-2 border border-amber-400/30">
                                    Misión de 3.º de Primaria
                                </span>
                                <h2 class="font-display text-3xl md:text-4xl font-bold text-white mb-2">
                                    ¡Hola, Alfonso! ¿Qué mundo exploramos hoy?
                                </h2>
                                <p class="text-slate-300 text-base md:text-lg max-w-2xl">
                                    Elige tu aventura favorita, supera los desafíos de escritura y gana premios en la ruleta al completar cada misión.
                                </p>
                            </div>

                            <!-- Resumen de dominio global -->
                            <div class="bg-slate-950/60 border border-white/10 rounded-2xl p-4 min-w-[210px] text-center shrink-0">
                                <div class="text-xs uppercase font-extrabold text-slate-400 tracking-wider mb-1">Progreso Total</div>
                                <div class="font-display text-3xl font-bold text-amber-400 mb-1">${globalPercent}%</div>
                                <div class="text-xs text-slate-400 font-bold">${totalDone} de ${totalQuestions} palabras dominadas</div>
                            </div>
                        </div>

                        <!-- Cuadrícula de los 4 Mundos -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6 mb-7">
                            ${worldsHtml}
                        </div>

                        <!-- Barra inferior de Entrenamiento Especial y Guía de Reglas -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <button onclick="app.startSmartReview()" class="btn-tactile rounded-2xl bg-gradient-to-r from-amber-500/20 to-orange-500/20 hover:from-amber-500/30 hover:to-orange-500/30 border-2 border-amber-400/50 p-4 md:p-5 flex items-center justify-between text-left">
                                <div class="flex items-center gap-4">
                                    <span class="text-3xl md:text-4xl">🎯</span>
                                    <div>
                                        <h4 class="font-display text-lg md:text-xl font-bold text-amber-300">
                                            ${hasFailed ? `Entrenamiento de Repaso (${this.state.failedIds.length} pendientes)` : 'Desafío Mezclado de Todos los Mundos'}
                                        </h4>
                                        <p class="text-xs md:text-sm text-slate-300">
                                            ${hasFailed ? 'Practica justo las palabras donde tuviste dudas antes.' : 'Una ronda rápida mezclando los 4 universos.'}
                                        </p>
                                    </div>
                                </div>
                                <span class="text-2xl text-amber-300 font-bold">➔</span>
                            </button>

                            <button onclick="app.openRulesBook()" class="btn-tactile rounded-2xl bg-slate-800/80 hover:bg-slate-800 border-2 border-white/10 p-4 md:p-5 flex items-center justify-between text-left">
                                <div class="flex items-center gap-4">
                                    <span class="text-3xl md:text-4xl">📖</span>
                                    <div>
                                        <h4 class="font-display text-lg md:text-xl font-bold text-sky-300">Chuleta Mágica de 3.º</h4>
                                        <p class="text-xs md:text-sm text-slate-300">Repasa rápido los trucos de B/V, H, tildes y mayúsculas.</p>
                                    </div>
                                </div>
                                <span class="text-2xl text-sky-300 font-bold">➔</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            /**
             * INICIAR UN MUNDO ESPECÍFICO
             */
            startWorld(worldId) {
                sfx.playTap();
                const world = WORLDS_DATA.find(w => w.id === worldId);
                if (!world) return;

                this.activeWorld = world;
                const uncompleted = world.questions.filter(q => !this.state.completedIds.includes(q.id));
                const completed = world.questions.filter(q => this.state.completedIds.includes(q.id));
                
                // Asegurar que salgan retos de escritura libre ('write') en cada sesión
                const writeQs = this.shuffle(world.questions.filter(q => q.type === 'write'));
                const otherPool = [...this.shuffle(uncompleted.filter(q => q.type !== 'write')), ...this.shuffle(completed.filter(q => q.type !== 'write'))];
                
                this.sessionQuestions = this.shuffle([...otherPool.slice(0, 6), ...writeQs.slice(0, 2)]);
                this.currentIndex = 0;
                this.sessionCorrect = 0;
                this.wheelSpinning = false;
                this.wheelSpunForSession = false;
                this.currentView = 'play';
                this.setBodyTheme(world.themeClass);
                this.renderQuestion();
            }

            /**
             * INICIAR REPASO INTELIGENTE O MEZCLA
             */
            startSmartReview() {
                sfx.playTap();
                const allQuestions = WORLDS_DATA.flatMap(w => w.questions);
                let pool = [];

                if (this.state.failedIds.length > 0) {
                    const failedQs = allQuestions.filter(q => this.state.failedIds.includes(q.id));
                    const extraQs = this.shuffle(allQuestions.filter(q => !this.state.failedIds.includes(q.id)));
                    pool = [...this.shuffle(failedQs), ...extraQs].slice(0, 8);
                } else {
                    pool = this.shuffle(allQuestions).slice(0, 8);
                }

                this.activeWorld = {
                    id: 'review',
                    title: 'Entrenamiento Especial',
                    themeClass: 'theme-hub'
                };
                this.sessionQuestions = pool;
                this.currentIndex = 0;
                this.sessionCorrect = 0;
                this.wheelSpinning = false;
                this.wheelSpunForSession = false;
                this.currentView = 'play';
                this.setBodyTheme('theme-hub');
                this.renderQuestion();
            }

            shuffle(array) {
                const arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            /**
             * VISTA 2: PANTALLA DE EJERCICIO INTERACTIVO
             */
            renderQuestion() {
                const q = this.sessionQuestions[this.currentIndex];
                this.hasAnsweredCurrent = false;
                this.selectedOrderWords = [];

                const container = document.getElementById('app-container');
                const progressPct = ((this.currentIndex) / this.sessionQuestions.length) * 100;

                const illustrationHtml = (q.art && WORD_ARTS[q.art]) ? `
                    <div class="w-28 h-28 sm:w-32 sm:h-32 mx-auto mb-4 rounded-3xl bg-slate-950/70 border-2 border-white/10 flex items-center justify-center shadow-inner animate-float">
                        ${WORD_ARTS[q.art]}
                    </div>
                ` : '';

                let interactiveAreaHtml = '';

                if (q.type === 'choice') {
                    interactiveAreaHtml = `
                        <div class="my-6 text-center">
                            <div class="inline-block bg-slate-950/80 border-2 border-white/15 rounded-2xl px-6 py-4 md:px-10 md:py-5 shadow-inner">
                                <span id="word-display" class="font-display text-3xl sm:text-4xl md:text-5xl font-bold tracking-wider text-amber-300">
                                    ${q.wordDisplay}
                                </span>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-${Math.min(q.options.length, 3)} gap-4 max-w-2xl mx-auto mt-6">
                            ${q.options.map((opt, idx) => `
                                <button onclick="app.checkChoiceAnswer(${idx}, this)" 
                                    class="option-btn btn-tactile py-5 px-6 rounded-2xl bg-slate-800 hover:bg-slate-700 border-2 border-white/15 border-b-4 border-slate-950 font-display text-2xl md:text-3xl font-bold text-white shadow-lg">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    `;
                } else if (q.type === 'syllable') {
                    interactiveAreaHtml = `
                        <p class="text-center text-slate-300 text-sm md:text-base mb-4">Pulsa sobre el bloque que suena más fuerte al pronunciar la palabra:</p>
                        <div class="flex flex-wrap justify-center gap-3 md:gap-5 my-6">
                            ${q.syllables.map((syl, idx) => `
                                <button onclick="app.checkSyllableAnswer(${idx}, this)"
                                    class="option-btn btn-tactile min-w-[95px] sm:min-w-[120px] py-6 px-6 rounded-3xl bg-gradient-to-b from-indigo-500/30 to-slate-800 hover:from-indigo-500/50 border-2 border-indigo-400/40 border-b-4 border-slate-950 font-display text-3xl md:text-4xl font-bold text-white shadow-lg">
                                    ${syl}
                                </button>
                            `).join('')}
                        </div>
                    `;
                } else if (q.type === 'order') {
                    const shuffledWords = this.shuffle(q.words.map((w, i) => ({ word: w, origIdx: i })));
                    this.currentOrderPool = shuffledWords;

                    interactiveAreaHtml = `
                        <!-- Zona donde se construye la frase -->
                        <div id="sentence-dropzone" class="min-h-[76px] bg-slate-950/80 border-2 border-dashed border-amber-400/40 rounded-2xl p-3 md:p-4 my-5 flex flex-wrap items-center justify-center gap-2.5">
                            <span class="text-slate-500 text-sm md:text-base font-semibold">Toca las palabras de abajo en orden...</span>
                        </div>

                        <!-- Banco de palabras desordenadas -->
                        <div id="word-bank" class="flex flex-wrap justify-center gap-2.5 md:gap-3 my-5">
                            ${shuffledWords.map((item, poolIdx) => `
                                <button id="bank-word-${poolIdx}" onclick="app.toggleOrderWord(${poolIdx})"
                                    class="btn-tactile py-3.5 px-5 rounded-2xl bg-slate-800 hover:bg-slate-700 border-2 border-white/15 border-b-4 border-slate-950 font-display text-xl md:text-2xl font-bold text-white shadow-md">
                                    ${item.word}
                                </button>
                            `).join('')}
                        </div>

                        <div class="text-center">
                            <button id="btn-check-order" disabled onclick="app.checkOrderAnswer()"
                                class="btn-tactile disabled:opacity-40 disabled:pointer-events-none px-8 py-4 rounded-2xl bg-gradient-to-b from-amber-400 to-orange-500 text-slate-950 border-b-4 border-orange-800 font-display font-bold text-xl shadow-lg">
                                Comprobar Frase ✓
                            </button>
                        </div>
                    `;
                } else if (q.type === 'write') {
                    setTimeout(() => sfx.speak(q.speakWord), 350);

                    interactiveAreaHtml = `
                        <div class="my-5 text-center">
                            <div class="flex flex-wrap items-center justify-center gap-3 mb-4">
                                <button onclick="sfx.speak('${q.speakWord.replace(/'/g, "\\'")}')"
                                    class="btn-tactile inline-flex items-center gap-2.5 px-6 py-3.5 rounded-2xl bg-sky-500 hover:bg-sky-400 text-slate-950 border-b-4 border-sky-800 font-display font-bold text-lg shadow-lg">
                                    <span class="text-2xl">🔊</span>
                                    <span>Escuchar palabra</span>
                                </button>
                                <span class="px-4 py-3 rounded-2xl bg-slate-950/70 border border-white/10 font-mono text-lg font-bold tracking-widest text-amber-300">
                                    Pista: ${q.hintMask}
                                </span>
                            </div>

                            <div class="max-w-md mx-auto mb-3">
                                <input id="dictation-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                                    placeholder="Escribe aquí la palabra..."
                                    onkeydown="if(event.key==='Enter') app.checkWriteAnswer()"
                                    class="w-full text-center font-display text-3xl sm:text-4xl font-bold bg-slate-950/90 border-2 border-amber-400/50 focus:border-amber-400 rounded-2xl py-4 px-5 text-white outline-none shadow-inner" />
                            </div>

                            <!-- Botones rápidos de vocales con tilde y ü para facilitar la escritura en tablet -->
                            <div class="flex flex-wrap justify-center gap-2 mb-5">
                                ${['á', 'é', 'í', 'ó', 'ú', 'ü'].map(ch => `
                                    <button type="button" onclick="app.insertSpecialChar('${ch}')"
                                        class="btn-tactile w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-slate-800 hover:bg-slate-700 border border-white/15 border-b-4 border-slate-950 font-display text-xl font-bold text-amber-300">
                                        ${ch}
                                    </button>
                                `).join('')}
                            </div>

                            <button id="btn-check-write" onclick="app.checkWriteAnswer()"
                                class="btn-tactile px-8 py-4 rounded-2xl bg-gradient-to-b from-emerald-400 to-emerald-600 text-slate-950 border-b-4 border-emerald-900 font-display font-bold text-xl shadow-lg">
                                Comprobar Escritura ✓
                            </button>
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="max-w-3xl w-full mx-auto animate-pop">
                        <!-- Barra superior de la misión -->
                        <div class="flex items-center justify-between gap-4 mb-4">
                            <button onclick="app.goHome()" class="btn-tactile px-4 py-2.5 rounded-2xl bg-slate-900/80 hover:bg-slate-800 border border-white/10 text-slate-300 font-bold text-sm flex items-center gap-2">
                                <span>←</span> Salir
                            </button>

                            <div class="flex-1 max-w-md">
                                <div class="flex justify-between text-xs font-extrabold text-slate-300 mb-1">
                                    <span>${this.activeWorld.title}</span>
                                    <span>Reto ${this.currentIndex + 1} de ${this.sessionQuestions.length}</span>
                                </div>
                                <div class="w-full h-3 bg-slate-950/80 rounded-full overflow-hidden border border-white/10">
                                    <div class="h-full bg-gradient-to-r from-amber-400 to-emerald-400 transition-all duration-300" style="width: ${progressPct}%"></div>
                                </div>
                            </div>

                            <div class="px-3 py-2 rounded-2xl bg-slate-900/80 border border-white/10 text-xs font-extrabold text-emerald-400">
                                ✓ ${this.sessionCorrect}
                            </div>
                        </div>

                        <!-- Tarjeta principal del ejercicio -->
                        <div class="bg-slate-900/90 border-2 border-white/15 rounded-3xl p-6 sm:p-8 shadow-2xl">
                            ${illustrationHtml}
                            <h3 class="font-display text-xl sm:text-2xl md:text-3xl font-bold text-center text-white leading-snug">
                                ${q.prompt}
                            </h3>

                            ${interactiveAreaHtml}

                            <!-- Contenedor para el feedback inmediato -->
                            <div id="feedback-box" class="hidden"></div>
                        </div>
                    </div>
                `;

                if (q.type === 'write') {
                    setTimeout(() => {
                        const inp = document.getElementById('dictation-input');
                        if (inp) inp.focus();
                    }, 150);
                }
            }

            checkChoiceAnswer(optionIndex, btnEl) {
                if (this.hasAnsweredCurrent) return;
                const q = this.sessionQuestions[this.currentIndex];
                const chosen = q.options[optionIndex];
                const isCorrect = chosen === q.answer;

                document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

                if (isCorrect) {
                    btnEl.classList.remove('bg-slate-800', 'border-white/15');
                    btnEl.classList.add('bg-emerald-500', 'text-slate-950', 'border-emerald-300');
                } else {
                    btnEl.classList.remove('bg-slate-800', 'border-white/15');
                    btnEl.classList.add('bg-rose-600', 'text-white', 'border-rose-300', 'animate-shake');
                    document.querySelectorAll('.option-btn').forEach((b, i) => {
                        if (q.options[i] === q.answer) {
                            b.classList.remove('bg-slate-800');
                            b.classList.add('bg-emerald-500/80', 'text-slate-950', 'border-emerald-300');
                        }
                    });
                }

                this.handleResult(isCorrect, btnEl);
            }

            checkSyllableAnswer(sylIndex, btnEl) {
                if (this.hasAnsweredCurrent) return;
                const q = this.sessionQuestions[this.currentIndex];
                const isCorrect = sylIndex === q.answerIndex;

                document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

                if (isCorrect) {
                    btnEl.classList.add('!bg-emerald-500', '!text-slate-950', '!border-emerald-200');
                } else {
                    btnEl.classList.add('!bg-rose-600', '!border-rose-300', 'animate-shake');
                    const btns = document.querySelectorAll('.option-btn');
                    if (btns[q.answerIndex]) {
                        btns[q.answerIndex].classList.add('!bg-emerald-500/80', '!text-slate-950');
                    }
                }

                this.handleResult(isCorrect, btnEl);
            }

            toggleOrderWord(poolIdx) {
                if (this.hasAnsweredCurrent) return;
                sfx.playTap();

                const existingPos = this.selectedOrderWords.indexOf(poolIdx);
                if (existingPos > -1) {
                    this.selectedOrderWords.splice(existingPos, 1);
                } else {
                    this.selectedOrderWords.push(poolIdx);
                }

                this.currentOrderPool.forEach((_, idx) => {
                    const bankBtn = document.getElementById(`bank-word-${idx}`);
                    if (this.selectedOrderWords.includes(idx)) {
                        bankBtn.classList.add('opacity-25', 'scale-95');
                    } else {
                        bankBtn.classList.remove('opacity-25', 'scale-95');
                    }
                });

                const dropzone = document.getElementById('sentence-dropzone');
                if (this.selectedOrderWords.length === 0) {
                    dropzone.innerHTML = `<span class="text-slate-500 text-sm md:text-base font-semibold">Toca las palabras de abajo en orden...</span>`;
                } else {
                    dropzone.innerHTML = this.selectedOrderWords.map(idx => `
                        <button onclick="app.toggleOrderWord(${idx})"
                            class="btn-tactile py-2.5 px-4 rounded-xl bg-amber-400 text-slate-950 font-display text-xl md:text-2xl font-bold shadow border-b-2 border-amber-700">
                            ${this.currentOrderPool[idx].word}
                        </button>
                    `).join('');
                }

                const checkBtn = document.getElementById('btn-check-order');
                checkBtn.disabled = this.selectedOrderWords.length !== this.currentOrderPool.length;
            }

            checkOrderAnswer() {
                if (this.hasAnsweredCurrent) return;
                const q = this.sessionQuestions[this.currentIndex];
                const constructed = this.selectedOrderWords.map(idx => this.currentOrderPool[idx].word).join(' ');
                const isCorrect = constructed === q.answer;

                const checkBtn = document.getElementById('btn-check-order');
                checkBtn.classList.add('hidden');
                const dropzone = document.getElementById('sentence-dropzone');

                if (isCorrect) {
                    dropzone.classList.remove('border-amber-400/40');
                    dropzone.classList.add('border-emerald-400', 'bg-emerald-950/40');
                } else {
                    dropzone.classList.remove('border-amber-400/40');
                    dropzone.classList.add('border-rose-500', 'bg-rose-950/40', 'animate-shake');
                }

                this.handleResult(isCorrect, dropzone);
            }

            insertSpecialChar(ch) {
                if (this.hasAnsweredCurrent) return;
                sfx.playTap();
                const inp = document.getElementById('dictation-input');
                if (!inp) return;
                const start = inp.selectionStart || inp.value.length;
                const end = inp.selectionEnd || inp.value.length;
                inp.value = inp.value.slice(0, start) + ch + inp.value.slice(end);
                inp.focus();
                inp.setSelectionRange(start + 1, start + 1);
            }

            checkWriteAnswer() {
                if (this.hasAnsweredCurrent) return;
                const q = this.sessionQuestions[this.currentIndex];
                const inp = document.getElementById('dictation-input');
                const btn = document.getElementById('btn-check-write');
                if (!inp) return;

                const typed = inp.value.trim().toLowerCase();
                if (!typed) {
                    inp.classList.add('animate-shake');
                    setTimeout(() => inp.classList.remove('animate-shake'), 400);
                    return;
                }

                inp.disabled = true;
                if (btn) btn.classList.add('hidden');

                const isCorrect = typed === q.answer.toLowerCase();
                if (isCorrect) {
                    inp.classList.add('border-emerald-400', 'text-emerald-300');
                } else {
                    inp.classList.add('border-rose-500', 'text-rose-300', 'animate-shake');
                }
                this.handleResult(isCorrect, inp);
            }

            /**
             * PROCESAR RESULTADO Y MOSTRAR EXPLICACIÓN PEDAGÓGICA
             */
            handleResult(isCorrect, targetEl) {
                this.hasAnsweredCurrent = true;
                const q = this.sessionQuestions[this.currentIndex];
                const feedbackBox = document.getElementById('feedback-box');

                if (isCorrect) {
                    sfx.playSuccess();
                    this.spawnParticles(targetEl);
                    this.sessionCorrect++;
                    this.state.stars += 10;
                    this.state.streak += 1;
                    if (this.state.streak > this.state.bestStreak) {
                        this.state.bestStreak = this.state.streak;
                    }
                    if (!this.state.completedIds.includes(q.id)) {
                        this.state.completedIds.push(q.id);
                    }
                    this.state.failedIds = this.state.failedIds.filter(id => id !== q.id);

                    this.checkTrophies();
                    this.saveState();

                    feedbackBox.className = 'mt-6 p-5 rounded-2xl bg-emerald-950/80 border-2 border-emerald-400 animate-pop';

            /**
             * GIRAR LA RULETA DE 4 PREMIOS
             */
            spinPrizeWheel() {
                if (this.wheelSpinning || this.wheelSpunForSession) return;
                this.wheelSpinning = true;
                this.wheelSpunForSession = true;
                sfx.playTap();

                const spinBtn = document.getElementById('btn-spin-wheel');
                if (spinBtn) {
                    spinBtn.disabled = true;
                    spinBtn.textContent = '...';
                }

                const prizeIndex = Math.floor(Math.random() * ROULETTE_PRIZES.length);
                const selectedPrize = ROULETTE_PRIZES[prizeIndex];
                const sectorCenters = [45, 135, 225, 315];
                const targetAngle = (360 - sectorCenters[prizeIndex]) % 360;
                const jitter = Math.floor(Math.random() * 40) - 20;

                const currentMod = ((this.wheelRotation % 360) + 360) % 360;
                const extraTurns = 360 * 6;
                this.wheelRotation += extraTurns + ((targetAngle - currentMod + 360) % 360) + jitter;

                const wheelEl = document.getElementById('prize-wheel');
                if (wheelEl) {
                    wheelEl.style.transform = `rotate(${this.wheelRotation}deg)`;
                }

                setTimeout(() => {
                    this.wheelSpinning = false;
                    sfx.playTrophy();
                    this.spawnMissionConfetti();

                    if (spinBtn) {
                        spinBtn.textContent = '★';
                    }

                    const actionArea = document.getElementById('wheel-action-area');
                    if (actionArea) {
                        actionArea.innerHTML = `
                            <div class="bg-gradient-to-r from-amber-500/20 via-emerald-500/20 to-amber-500/20 border-2 border-amber-400 rounded-2xl p-4 sm:p-5 animate-pop">
                                <p class="text-xs uppercase font-extrabold tracking-widest text-amber-300 mb-1">🎉 ¡Premio Conseguido y Guardado en Trofeos! 🎉</p>

                                <p class="text-slate-200 text-sm sm:text-base font-semibold">${selectedPrize.desc}</p>
                            </div>
                        `;
                    }

                    if (!this.state.wheelVouchers) this.state.wheelVouchers = [];
                    this.state.wheelVouchers.unshift({
                        id: Date.now(),
                        title: selectedPrize.shortLabel,
                        desc: selectedPrize.desc,
                        date: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }),
                        redeemed: false
                    });
                    this.saveState();
                    sfx.speak(`¡Premio conseguido! ${selectedPrize.label}`);
                }, 4100);
            }

            /**
             * PARTÍCULAS DE CELEBRACIÓN EN ACIERTOS Y FIN DE MISIÓN
             */
            spawnParticles(el) {
                if (!el) return;
                const rect = el.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const emojis = ['⭐', '✨', '🔥', '💎', '⚡'];

                for (let i = 0; i < 12; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle text-2xl';
                    p.textContent = emojis[i % emojis.length];
                    const angle = (Math.PI * 2 * i) / 12;
                    const dist = 60 + Math.random() * 80;
                    p.style.left = `${centerX}px`;
                    p.style.top = `${centerY}px`;
                    p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
                    p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
                    document.body.appendChild(p);
                    setTimeout(() => p.remove(), 1000);
                }
            }

            spawnMissionConfetti() {
                const emojis = ['🎉', '⭐', '🏆', '✨', '🎊', '💎', '⚡', '🔮'];
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 3;
                for (let i = 0; i < 24; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle text-3xl';
                    p.textContent = emojis[i % emojis.length];
                    const angle = (Math.PI * 2 * i) / 24;
                    const dist = 100 + Math.random() * 180;
                    p.style.left = `${cx}px`;
                    p.style.top = `${cy}px`;
                    p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
                    p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
                    document.body.appendChild(p);
                    setTimeout(() => p.remove(), 1100);
                }
            }

            /**
             * COMPROBAR DESBLOQUEO DE TROFEOS
             */
            checkTrophies() {
                let newlyUnlocked = false;
                TROPHIES_DATA.forEach(t => {
                    if (!this.state.unlockedTrophies.includes(t.id) && t.condition(this.state)) {
                        this.state.unlockedTrophies.push(t.id);
                        newlyUnlocked = true;
                    }
                });
                if (newlyUnlocked) {
                    setTimeout(() => sfx.playTrophy(), 300);
                }
            }

                    ${vouchersHtml}

                    <h4 class="font-display text-lg font-bold text-emerald-300 mb-3">✨ Reliquias de Misión</h4>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                        ${missionGalleryHtml}
                    </div>

                    <h4 class="font-display text-lg font-bold text-amber-300 mb-3">🏅 Medallas de Maestría</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                        ${allTrophiesHtml}
                    </div>
                    <div class="text-center">
                        <button onclick="app.closeModal()" class="btn-tactile px-8 py-3.5 rounded-2xl bg-amber-400 text-slate-950 font-display font-bold text-lg border-b-4 border-amber-700">
                            ¡Seguir Jugando!
                        </button>
                    </div>
                `;

                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            }

            /**
             * MODAL: LIBRO DE TRUCOS DE 3.º DE PRIMARIA
             */
            openRulesBook() {
                sfx.playTap();
                const overlay = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');

                content.innerHTML = `
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="font-display text-2xl md:text-3xl font-bold text-sky-300">📖 Chuleta Mágica de 3.º</h3>
                        <button onclick="app.closeModal()" class="btn-tactile w-11 h-11 rounded-2xl bg-slate-800 text-white font-bold text-xl border border-white/15">✕</button>
                    </div>
                    <div class="space-y-4 text-slate-200">
                        <div class="p-4 rounded-2xl bg-emerald-950/50 border border-emerald-500/30">
                            <h4 class="font-display font-bold text-lg text-emerald-300 mb-1">🧱 Reglas de B/V y G/J</h4>
                            <p class="text-sm md:text-base">• Siempre <strong>B</strong> después de <strong>M</strong> (<em>tambor</em>) y delante de consonante (<em>brújula, bloque</em>).<br>• Con <strong>G</strong>: <em>ga, go, gu</em>. Si suena suave con E/I lleva U muda: <em>gue, gui</em> (<em>hoguera</em>). Si suena la U lleva diéresis: <em>güe, güi</em> (<em>pingüino</em>).</p>
                        </div>
                        <div class="p-4 rounded-2xl bg-rose-950/50 border border-rose-500/30">
                            <h4 class="font-display font-bold text-lg text-rose-300 mb-1">⚡ Reglas de H, LL/Y y R/RR</h4>
                            <p class="text-sm md:text-base">• Llevan <strong>H</strong> las palabras que empiezan por <em>hie-</em> y <em>hue-</em> (<em>hielo, huevo</em>) y los verbos <em>haber</em> y <em>hacer</em>.<br>• Se escribe <strong>RR</strong> solo entre vocales cuando suena fuerte (<em>torre</em>). Al principio (<em>roca</em>) o detrás de N/L/S (<em>Enrique</em>) va una sola R.</p>
                        </div>
                        <div class="p-4 rounded-2xl bg-purple-950/50 border border-purple-500/30">
                            <h4 class="font-display font-bold text-lg text-purple-300 mb-1">🔮 Tildes y C / Z / QU</h4>
                            <p class="text-sm md:text-base">• <strong>Agudas</strong> (fuerte al final): llevan tilde si acaban en vocal, N o S (<em>pudín, dragón</em>).<br>• <strong>Esdrújulas</strong> (antepenúltima fuerte): llevan tilde SIEMPRE (<em>mágico, rápido</em>).</p>
                        </div>
                        <div class="p-4 rounded-2xl bg-sky-950/50 border border-sky-500/30">
                            <h4 class="font-display font-bold text-lg text-sky-300 mb-1">🪄 Mayúsculas y Puntuación</h4>
                            <p class="text-sm md:text-base">• Mayúscula al empezar, después de punto y en nombres propios.<br>• En español las preguntas y exclamaciones llevan signo al abrir y al cerrar: <strong>¿...?</strong> y <strong>¡...!</strong></p>
                        </div>
                    </div>
                    <div class="mt-6 text-center">
                        <button onclick="app.closeModal()" class="btn-tactile px-8 py-3.5 rounded-2xl bg-sky-400 text-slate-950 font-display font-bold text-lg border-b-4 border-sky-700">
                            ¡Listo!
                        </button>
                    </div>
                `;

                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            }

            redeemVoucher(voucherId) {
                sfx.playTap();
                const voucher = (this.state.wheelVouchers || []).find(v => v.id === voucherId);
                if (voucher) {
                    voucher.redeemed = true;
                    this.saveState();
                    this.openTrophies();
                }
            }

            closeModal() {
                sfx.playTap();
                const overlay = document.getElementById('modal-overlay');
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            }
        }

        // Instancia global
        const app = new AventuraApp();
    </script>
</body>
</html>
