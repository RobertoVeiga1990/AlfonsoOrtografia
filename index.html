        /* Estilos base optimizados para tablet táctil */
        * {

            overflow-x: hidden;

        h1, h2, h3, .font-display {

        /* Efecto de botón táctil 3D */
        .btn-tactile {
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.1s ease;
        }
        .btn-tactile:active {
            transform: translateY(4px) scale(0.98);
        }

        /* Animaciones personalizadas */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 3.5s ease-in-out infinite;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;

        }

    <script>
        /**
         * MOTOR DE AUDIO SINTETIZADO (Web Audio API)
         * Genera efectos agradables sin depender de archivos externos.
         */
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTap() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(680, this.ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.07);
            }

            playSuccess() {
                if (!this.enabled) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // Do5, Mi5, Sol5, Do6
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    const startTime = this.ctx.currentTime + i * 0.08;
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.18, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.26);
                });
            }

            playHint() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(340, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(290, this.ctx.currentTime + 0.22);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.24);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playTrophy() {
                if (!this.enabled) return;
                this.init();
                const notes = [587.33, 739.99, 880, 1174.66];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    const t = this.ctx.currentTime + i * 0.11;
                    osc.frequency.setValueAtTime(freq, t);
                    gain.gain.setValueAtTime(0.22, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.42);
                });
            }
        }

        /**
         * ESTADO Y CONTROLADOR PRINCIPAL DE LA APLICACIÓN
         */
        class AventuraApp {
            constructor() {
                this.state = this.loadState();
                this.currentView = 'hub'; // 'hub' | 'play' | 'summary'
                this.activeWorld = null;
                this.sessionQuestions = [];
                this.currentIndex = 0;
                this.isReviewMode = false;
                this.hasAnsweredCurrent = false;
                this.selectedOrderWords = [];
                this.sessionCorrect = 0;
                
                this.updateHeader();
                this.renderHub();
            }

            loadState() {
                try {
                    const saved = localStorage.getItem('aventura_ortografica_alfonso_v1');
                    if (saved) {
                        return JSON.parse(saved);
                    }
                } catch (e) {
                    console.warn('No se pudo leer localStorage', e);
                }
                return {
                    stars: 0,
                    streak: 0,
                    bestStreak: 0,
                    completedIds: [], // IDs de preguntas acertadas al menos una vez
                    failedIds: [],    // IDs de preguntas falladas pendientes de repaso
                    unlockedTrophies: [],
                    sound: true
                };
            }

            saveState() {
                try {
                    localStorage.setItem('aventura_ortografica_alfonso_v1', JSON.stringify(this.state));
                } catch (e) {
                    console.warn('No se pudo guardar en localStorage', e);
                }
                this.updateHeader();
            }

            toggleSound() {
                this.state.sound = !this.state.sound;
                sfx.enabled = this.state.sound;
                document.getElementById('btn-sound').textContent = this.state.sound ? '🔊' : '🔇';
                if (this.state.sound) sfx.playTap();
                this.saveState();
            }

            updateHeader() {
                sfx.enabled = this.state.sound;
                document.getElementById('btn-sound').textContent = this.state.sound ? '🔊' : '🔇';
                document.getElementById('header-streak').textContent = this.state.streak;
                document.getElementById('header-stars').textContent = this.state.stars;
                document.getElementById('header-trophy-count').textContent = `${this.state.unlockedTrophies.length}/8`;
            }

            goHome() {
                sfx.playTap();
                this.currentView = 'hub';
                this.activeWorld = null;
                this.isReviewMode = false;
                document.body.className = 'text-slate-100 min-h-screen flex flex-col justify-between theme-hub';
                this.renderHub();
            }

            /**
             * PANTALLA PRINCIPAL (SELECCIÓN DE MUNDOS)
             */
            renderHub() {
                const container = document.getElementById('app-container');
                const totalQuestions = WORLDS.reduce((acc, w) => acc + w.questions.length, 0);
                const totalCompleted = this.state.completedIds.length;
                const failedCount = this.state.failedIds.length;

                let reviewBanner = '';
                if (failedCount > 0) {
                    reviewBanner = `
                        <div class="mb-6 bg-gradient-to-r from-amber-500/20 via-orange-500/20 to-rose-500/20 border-2 border-amber-400/50 rounded-3xl p-4 md:p-5 flex flex-col sm:flex-row items-center justify-between gap-4 animate-pop">
                            <div class="flex items-center gap-4 text-center sm:text-left">
                                <div class="w-12 h-12 rounded-2xl bg-amber-400/20 border border-amber-400 flex items-center justify-center text-2xl shrink-0">🎯</div>
                                <div>
                                    <h3 class="font-display font-bold text-lg text-amber-300">¡Tienes ${failedCount} ${failedCount === 1 ? 'reto pendiente' : 'retos pendientes'} de repaso!</h3>
                                    <p class="text-sm text-slate-300">Practica las palabras que fallaste para recuperar todas tus estrellas.</p>
                                </div>
                            </div>
                            <button onclick="app.startReviewMode()" class="btn-tactile w-full sm:w-auto bg-gradient-to-b from-amber-400 to-orange-500 text-slate-950 font-display font-bold px-6 py-3.5 rounded-2xl border-b-4 border-orange-800 shadow-lg text-base shrink-0">
                                Repasar Fallos (${failedCount})
                            </button>
                        </div>
                    `;
                }

                const worldsHtml = WORLDS.map(world => {
                    const worldCompleted = world.questions.filter(q => this.state.completedIds.includes(q.id)).length;
                    const worldTotal = world.questions.length;
                    const pct = Math.round((worldCompleted / worldTotal) * 100);

                    return `
                        <div onclick="app.startWorld('${world.id}')" class="btn-tactile cursor-pointer group relative overflow-hidden rounded-3xl bg-gradient-to-br ${world.cardBg} border-2 ${world.borderColor} p-6 md:p-7 shadow-xl flex flex-col justify-between transition-all hover:scale-[1.01]">
                            <div>
                                <div class="flex items-start justify-between gap-4 mb-4">
                                    <div class="p-3 rounded-2xl bg-white/5 border border-white/10 group-hover:scale-105 transition-transform">
                                        ${world.iconSvg}
                                    </div>
                                    <span class="px-3 py-1 rounded-full text-xs font-extrabold uppercase tracking-wider ${world.badgeBg}">
                                        ${worldCompleted}/${worldTotal} Completados
                                    </span>
                                </div>
                                <h2 class="font-display text-2xl md:text-3xl font-bold text-white mb-1">${world.name}</h2>
                                <p class="text-slate-300 text-sm md:text-base font-medium mb-5">${world.subtitle}</p>
                            </div>

                            <div>
                                <!-- Barra de progreso del mundo -->
                                <div class="w-full h-3.5 bg-slate-950/70 rounded-full overflow-hidden border border-white/10 mb-4">
                                    <div class="h-full bg-gradient-to-r from-amber-400 to-emerald-400 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                                </div>
                                <div class="w-full py-3.5 rounded-2xl bg-gradient-to-b ${world.btnClass} border-b-4 font-display font-bold text-center text-lg shadow-md">
                                    ${worldCompleted === worldTotal ? '¡Volver a Jugar!' : '¡Entrar al Mundo!'}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = `
                    <div class="animate-pop">
                        <!-- Bienvenida y progreso global -->
                        <div class="text-center max-w-2xl mx-auto mb-6 md:mb-8">
                            <span class="inline-block px-4 py-1.5 rounded-full bg-white/10 border border-white/15 text-amber-300 font-bold text-xs md:text-sm mb-3">
                                Progreso Global: ${totalCompleted} de ${totalQuestions} misiones superadas
                            </span>
                            <h2 class="font-display text-3xl md:text-4xl font-bold text-white mb-2">
                                ¡Hola, Alfonso! Elige tu aventura
                            </h2>
                            <p class="text-slate-300 text-base md:text-lg">
                                Supera los retos de cada mundo para desbloquear todos los trofeos legendarios.
                            </p>
                        </div>

                        ${reviewBanner}

                        <!-- Rejilla de 4 Mundos (2x2 en tablet horizontal, 1 columna en móvil estrecho) -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
                            ${worldsHtml}
                        </div>

                        <!-- Botón de Chuleta de Reglas de 3.º -->
                        <div class="mt-8 text-center">
                            <button onclick="app.openRulesBook()" class="btn-tactile inline-flex items-center gap-2.5 bg-slate-800/90 hover:bg-slate-800 text-sky-300 border border-sky-400/30 border-b-4 border-slate-950 px-6 py-3.5 rounded-2xl font-display font-bold text-base md:text-lg">
                                <span>📖</span>
                                <span>Libro de Trucos de 3.º de Primaria</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            /**
             * INICIAR UN MUNDO TEMÁTICO
             */
            startWorld(worldId) {
                sfx.playTap();
                const world = WORLDS.find(w => w.id === worldId);
                if (!world) return;

                this.activeWorld = world;
                this.isReviewMode = false;
                
                // Priorizar preguntas no completadas, luego mezclar el resto para llegar a una ronda dinámica de hasta 8 preguntas (o todas si quiere seguir)
                const uncompleted = world.questions.filter(q => !this.state.completedIds.includes(q.id));
                const completed = world.questions.filter(q => this.state.completedIds.includes(q.id));
                
                const pool = [...this.shuffle(uncompleted), ...this.shuffle(completed)];
                this.sessionQuestions = pool.slice(0, 8); // Sesiones ágiles de 8 retos ideales para tablet
                this.currentIndex = 0;
                this.sessionCorrect = 0;
                this.currentView = 'play';

                document.body.className = `text-slate-100 min-h-screen flex flex-col justify-between ${world.themeClass}`;
                this.renderQuestion();
            }

            /**
             * INICIAR MODO REPASO DE FALLOS
             */
            startReviewMode() {
                sfx.playTap();
                const allQuestions = WORLDS.flatMap(w => w.questions.map(q => ({ ...q, worldRef: w })));
                const toReview = allQuestions.filter(q => this.state.failedIds.includes(q.id));
                
                if (toReview.length === 0) return;

                this.activeWorld = {
                    id: 'review',
                    name: 'Entrenamiento Especial de Repaso',
                    themeClass: 'theme-hub',
                    btnClass: 'from-amber-400 to-orange-500 border-orange-800 text-slate-950'
                };
                this.isReviewMode = true;
                this.sessionQuestions = this.shuffle(toReview);
                this.currentIndex = 0;
                this.sessionCorrect = 0;
                this.currentView = 'play';

                document.body.className = 'text-slate-100 min-h-screen flex flex-col justify-between theme-hub';
                this.renderQuestion();
            }

            shuffle(array) {
                const arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            /**
             * RENDERIZAR PREGUNTA ACTUAL
             */
            renderQuestion() {
                const container = document.getElementById('app-container');
                const q = this.sessionQuestions[this.currentIndex];
                this.hasAnsweredCurrent = false;
                this.selectedOrderWords = [];

                const progressPct = Math.round(((this.currentIndex) / this.sessionQuestions.length) * 100);
                const worldTitle = this.isReviewMode ? `Repaso (${q.worldRef.name})` : this.activeWorld.name;

                let interactionArea = '';

                if (q.type === 'choice') {
                    interactionArea = `
                        <div class="bg-slate-950/60 border-2 border-white/10 rounded-3xl p-6 md:p-8 text-center mb-6">
                            <p class="font-display text-2xl sm:text-3xl md:text-4xl font-bold tracking-wide text-amber-300">
                                ${q.sentence}
                            </p>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-${q.options.length > 2 ? '3' : '2'} gap-4">
                            ${q.options.map((opt, idx) => `
                                <button onclick="app.checkChoiceAnswer('${opt.replace(/'/g, "\\'")}', this)" 
                                    class="choice-btn btn-tactile min-h-[68px] md:min-h-[76px] px-6 py-4 rounded-2xl bg-slate-800 hover:bg-slate-700 border-2 border-white/15 border-b-4 border-slate-950 font-display text-2xl md:text-3xl font-bold text-white shadow-lg flex items-center justify-center">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    `;
                } else if (q.type === 'syllable') {
                    interactionArea = `
                        <div class="bg-slate-950/60 border-2 border-white/10 rounded-3xl p-6 md:p-8 text-center mb-6">
                            <p class="text-sm uppercase tracking-widest text-slate-400 font-bold mb-2">Pulsa la sílaba tónica</p>
                            <p class="font-display text-3xl sm:text-4xl md:text-5xl font-bold tracking-widest text-white">
                                ${q.wordDisplay}
                            </p>
                        </div>
                        <div class="flex flex-wrap items-center justify-center gap-4">
                            ${q.syllables.map(syl => `
                                <button onclick="app.checkChoiceAnswer('${syl}', this)" 
                                    class="choice-btn btn-tactile min-w-[110px] md:min-w-[140px] min-h-[76px] px-7 py-4 rounded-2xl bg-indigo-900/80 hover:bg-indigo-800 border-2 border-indigo-400/40 border-b-4 border-indigo-950 font-display text-2xl md:text-3xl font-bold text-amber-300 shadow-lg">
                                    ${syl}
                                </button>
                            `).join('')}
                        </div>
                    `;
                } else if (q.type === 'order') {
                    const shuffledWords = this.shuffle(q.words.map((w, i) => ({ text: w, id: i })));
                    this.currentOrderBank = shuffledWords;

                    interactionArea = `
                        <!-- Zona de construcción de la frase -->
                        <div id="order-dropzone" class="min-h-[84px] bg-slate-950/70 border-2 border-dashed border-amber-400/40 rounded-3xl p-4 md:p-5 mb-5 flex flex-wrap items-center justify-center gap-2.5">
                            <span class="text-slate-500 font-semibold text-base">Toca las palabras de abajo en orden...</span>
                        </div>

                        <!-- Banco de palabras táctiles -->
                        <div id="order-bank" class="flex flex-wrap items-center justify-center gap-3 mb-6">
                            ${shuffledWords.map(item => `
                                <button id="word-btn-${item.id}" onclick="app.toggleOrderWord(${item.id}, '${item.text.replace(/'/g, "\\'")}')" 
                                    class="btn-tactile min-h-[58px] px-5 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 border-2 border-white/15 border-b-4 border-slate-950 font-display text-xl md:text-2xl font-bold text-white shadow-md">
                                    ${item.text}
                                </button>
                            `).join('')}
                        </div>

                        <!-- Botones de acción para comprobar u ordenar -->
                        <div class="flex items-center justify-center gap-4">
                            <button onclick="app.resetOrderWords()" class="btn-tactile min-h-[58px] px-6 py-3 rounded-2xl bg-slate-800 text-slate-300 border border-white/15 border-b-4 border-slate-950 font-display font-bold text-lg">
                                ↺ Borrar
                            </button>
                            <button id="btn-check-order" onclick="app.checkOrderAnswer()" disabled
                                class="btn-tactile min-h-[58px] px-8 py-3 rounded-2xl bg-gradient-to-b from-emerald-400 to-emerald-600 disabled:opacity-40 disabled:pointer-events-none text-slate-950 border-b-4 border-emerald-900 font-display font-bold text-xl shadow-lg">
                                Comprobar Frase ✓
                            </button>
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="max-w-3xl mx-auto w-full animate-pop">
                        <!-- Barra superior del reto -->
                        <div class="flex items-center justify-between gap-4 mb-4">
                            <button onclick="app.goHome()" class="btn-tactile px-4 py-2.5 rounded-2xl bg-slate-900/80 hover:bg-slate-800 border border-white/15 font-display font-bold text-sm md:text-base text-slate-200 flex items-center gap-2">
                                <span>←</span>
                                <span>Mundos</span>
                            </button>
                            <div class="text-center">
                                <span class="text-xs md:text-sm font-extrabold uppercase tracking-wider text-amber-300">${worldTitle}</span>
                                <p class="text-xs text-slate-400 font-bold">Reto ${this.currentIndex + 1} de ${this.sessionQuestions.length}</p>
                            </div>
                            <div class="w-20 text-right font-display font-bold text-emerald-400 text-sm md:text-base">
                                ${this.sessionCorrect} ✓
                            </div>
                        </div>

                        <!-- Barra de progreso -->
                        <div class="w-full h-3 bg-slate-950/70 rounded-full overflow-hidden border border-white/10 mb-6">
                            <div class="h-full bg-gradient-to-r from-amber-400 to-emerald-400 transition-all duration-300" style="width: ${progressPct}%"></div>
                        </div>

                        <!-- Tarjeta del Ejercicio -->
                        <div class="bg-slate-900/85 backdrop-blur-md border-2 border-white/15 rounded-3xl p-6 md:p-8 shadow-2xl">
                            <h3 class="font-display text-xl sm:text-2xl md:text-3xl font-bold text-white text-center mb-6 leading-snug">
                                ${q.prompt}
                            </h3>

                            ${interactionArea}

                            <!-- Panel de Feedback (oculto hasta responder) -->
                            <div id="feedback-box" class="hidden mt-6 rounded-2xl p-5 md:p-6 border-2 animate-pop"></div>
                        </div>
                    </div>
                `;
            }

            /**
             * LÓGICA PARA EJERCICIOS DE ORDENAR BLOQUES
             */
            toggleOrderWord(id, text) {
                if (this.hasAnsweredCurrent) return;
                sfx.playTap();

                const existingIdx = this.selectedOrderWords.findIndex(w => w.id === id);
                const bankBtn = document.getElementById(`word-btn-${id}`);

                if (existingIdx > -1) {
                    this.selectedOrderWords.splice(existingIdx, 1);
                    if (bankBtn) bankBtn.classList.remove('opacity-30', 'pointer-events-none');
                } else {
                    this.selectedOrderWords.push({ id, text });
                    if (bankBtn) bankBtn.classList.add('opacity-30', 'pointer-events-none');
                }

                this.renderOrderDropzone();
            }

            resetOrderWords() {
                if (this.hasAnsweredCurrent) return;
                sfx.playTap();
                this.selectedOrderWords = [];
                document.querySelectorAll('#order-bank button').forEach(b => b.classList.remove('opacity-30', 'pointer-events-none'));
                this.renderOrderDropzone();
            }

            renderOrderDropzone() {
                const dz = document.getElementById('order-dropzone');
                const checkBtn = document.getElementById('btn-check-order');
                const q = this.sessionQuestions[this.currentIndex];

                if (this.selectedOrderWords.length === 0) {
                    dz.innerHTML = `<span class="text-slate-500 font-semibold text-base">Toca las palabras de abajo en orden...</span>`;
                } else {
                    dz.innerHTML = this.selectedOrderWords.map(w => `
                        <button onclick="app.toggleOrderWord(${w.id}, '${w.text.replace(/'/g, "\\'")}')" 
                            class="btn-tactile px-4 py-2.5 rounded-xl bg-amber-400 text-slate-950 font-display text-xl md:text-2xl font-bold shadow">
                            ${w.text}
                        </button>
                    `).join('');
                }

                if (checkBtn) {
                    checkBtn.disabled = this.selectedOrderWords.length !== q.words.length;
                }
            }

            checkOrderAnswer() {
                if (this.hasAnsweredCurrent) return;
                const q = this.sessionQuestions[this.currentIndex];
                const userSentence = this.selectedOrderWords.map(w => w.text).join(' ');
                const isCorrect = userSentence === q.answer;
                this.handleResult(isCorrect, null);
            }

            /**
             * LÓGICA PARA EJERCICIOS DE OPCIÓN MÚLTIPLE Y SÍLABA TÓNICA
             */
            checkChoiceAnswer(selectedOption, btnElement) {
                if (this.hasAnsweredCurrent) return;
                const q = this.sessionQuestions[this.currentIndex];
                const isCorrect = selectedOption === q.answer;
                this.handleResult(isCorrect, btnElement);
            }

            /**
             * PROCESAR RESULTADO, FEEDBACK Y RECOMPENSAS
             */
            handleResult(isCorrect, btnElement) {
                this.hasAnsweredCurrent = true;
                const q = this.sessionQuestions[this.currentIndex];
                const feedbackBox = document.getElementById('feedback-box');

                // Desactivar botones de opciones
                document.querySelectorAll('.choice-btn').forEach(btn => {
                    btn.classList.add('pointer-events-none');
                    if (btn.textContent.trim() === q.answer) {
                        btn.classList.remove('bg-slate-800', 'bg-indigo-900/80');
                        btn.classList.add('bg-emerald-500', 'text-slate-950', 'border-emerald-300');
                    }
                });

                if (isCorrect) {
                    sfx.playSuccess();
                    this.spawnCelebrationParticles(btnElement);
                    this.sessionCorrect++;
                    this.state.stars += 10;
                    this.state.streak += 1;
                    if (this.state.streak > this.state.bestStreak) {
                        this.state.bestStreak = this.state.streak;
                    }

                    // Marcar como completada y quitar de fallos si estaba
                    if (!this.state.completedIds.includes(q.id)) {
                        this.state.completedIds.push(q.id);
                    }
                    this.state.failedIds = this.state.failedIds.filter(id => id !== q.id);

                    const newlyUnlocked = this.checkTrophies();
                    this.saveState();

                    let trophyAlert = '';
                    if (newlyUnlocked) {
                        trophyAlert = `
                            <div class="mt-3 p-3 rounded-xl bg-amber-400/20 border border-amber-400 flex items-center gap-3">
                                <span class="text-3xl">${newlyUnlocked.icon}</span>
                                <div>
                                    <p class="text-xs uppercase font-extrabold text-amber-300">¡Nuevo Trofeo Desbloqueado!</p>
                                    <p class="font-display font-bold text-white text-lg">${newlyUnlocked.name}</p>
                                </div>
                            </div>
                        `;
                    }

                    feedbackBox.className = 'mt-6 rounded-2xl p-5 md:p-6 border-2 bg-emerald-950/90 border-emerald-400 animate-pop';
                    feedbackBox.innerHTML = `
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div>
                                <h4 class="font-display text-2xl font-bold text-emerald-300 flex items-center gap-2">
                                    <span>🌟</span> ¡Genial, Alfonso! +10 estrellas
                                </h4>
                                <p class="text-slate-200 text-base mt-1 font-medium">${q.rule}</p>
                                ${trophyAlert}
                            </div>
                            <button onclick="app.nextQuestion()" class="btn-tactile w-full sm:w-auto shrink-0 px-7 py-4 rounded-2xl bg-gradient-to-b from-emerald-400 to-emerald-600 text-slate-950 border-b-4 border-emerald-900 font-display font-bold text-xl shadow-lg">
                                Siguiente →
                            </button>
                        </div>
                    `;
                } else {
                    sfx.playHint();
                    if (btnElement) {
                        btnElement.classList.remove('bg-slate-800', 'bg-indigo-900/80');
                        btnElement.classList.add('bg-rose-600/80', 'border-rose-300', 'animate-shake');
                    }

                    this.state.streak = 0;
                    if (!this.state.failedIds.includes(q.id)) {
                        this.state.failedIds.push(q.id);
                    }
                    this.saveState();

                    feedbackBox.className = 'mt-6 rounded-2xl p-5 md:p-6 border-2 bg-amber-950/90 border-amber-400 animate-pop';
                    feedbackBox.innerHTML = `
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div>
                                <h4 class="font-display text-xl md:text-2xl font-bold text-amber-300 flex items-center gap-2">
                                    <span>💡</span> ¡Casi! Fíjate en este truco:
                                </h4>
                                <p class="text-white text-base md:text-lg mt-1 font-semibold">${q.rule}</p>
                                <p class="text-emerald-300 text-sm font-bold mt-2">Respuesta correcta: <span class="underline">${q.answer}</span></p>
                            </div>
                            <button onclick="app.nextQuestion()" class="btn-tactile w-full sm:w-auto shrink-0 px-7 py-4 rounded-2xl bg-gradient-to-b from-amber-400 to-orange-500 text-slate-950 border-b-4 border-orange-800 font-display font-bold text-xl shadow-lg">
                                ¡Entendido! →
                            </button>
                        </div>
                    `;
                }
            }

            nextQuestion() {
                sfx.playTap();
                if (this.currentIndex + 1 < this.sessionQuestions.length) {
                    this.currentIndex++;
                    this.renderQuestion();
                } else {
                    this.renderSummary();
                }
            }

            /**
             * PANTALLA RESUMEN DE RONDA
             */
            renderSummary() {
                sfx.playTrophy();
                const container = document.getElementById('app-container');
                const total = this.sessionQuestions.length;
                const earnedStars = this.sessionCorrect * 10;

                container.innerHTML = `
                    <div class="max-w-xl mx-auto w-full bg-slate-900/90 border-2 border-amber-400/50 rounded-3xl p-8 text-center shadow-2xl animate-pop">
                        <div class="text-6xl mb-4 animate-float">🏆</div>
                        <h2 class="font-display text-3xl md:text-4xl font-bold text-white mb-2">
                            ¡Misión Completada!
                        </h2>
                        <p class="text-slate-300 text-lg mb-6">
                            Has superado <span class="text-emerald-400 font-extrabold">${this.sessionCorrect} de ${total}</span> retos en ${this.activeWorld.name}.
                        </p>

                        <div class="grid grid-cols-2 gap-4 mb-8">
                            <div class="bg-slate-950/70 border border-white/10 rounded-2xl p-4">
                                <p class="text-xs uppercase text-slate-400 font-bold">Estrellas ganadas</p>
                                <p class="font-display text-3xl font-bold text-amber-300 mt-1">+${earnedStars} ⭐</p>
                            </div>
                            <div class="bg-slate-950/70 border border-white/10 rounded-2xl p-4">
                                <p class="text-xs uppercase text-slate-400 font-bold">Mejor racha</p>
                                <p class="font-display text-3xl font-bold text-orange-400 mt-1">${this.state.bestStreak} 🔥</p>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-4 justify-center">
                            <button onclick="app.goHome()" class="btn-tactile flex-1 py-4 px-6 rounded-2xl bg-gradient-to-b from-amber-400 to-orange-500 text-slate-950 border-b-4 border-orange-800 font-display font-bold text-xl shadow-lg">
                                Volver a los Mundos
                            </button>
                            ${!this.isReviewMode ? `
                                <button onclick="app.startWorld('${this.activeWorld.id}')" class="btn-tactile flex-1 py-4 px-6 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white border border-white/15 border-b-4 border-slate-950 font-display font-bold text-xl">
                                    Otra Ronda ↻
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            /**
             * COMPROBAR DESBLOQUEO DE TROFEOS
             */
            checkTrophies() {
                let newlyUnlocked = null;
                WORLDS.forEach(w => {
                    const worldSolved = w.questions.filter(q => this.state.completedIds.includes(q.id)).length;
                    w.trophies.forEach(t => {
                        if (worldSolved >= t.req && !this.state.unlockedTrophies.includes(t.id)) {
                            this.state.unlockedTrophies.push(t.id);
                            newlyUnlocked = t;
                        }
                    });
                });
                if (newlyUnlocked) {
                    sfx.playTrophy();
                }
                return newlyUnlocked;
            }

            /**
             * MODAL: ÁLBUM DE TROFEOS
             */
            openTrophies() {
                sfx.playTap();
                const overlay = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');

                const allTrophiesHtml = WORLDS.map(w => {
                    return w.trophies.map(t => {
                        const unlocked = this.state.unlockedTrophies.includes(t.id);
                        return `
                            <div class="rounded-2xl p-4 border-2 ${unlocked ? 'bg-gradient-to-br from-amber-500/20 to-slate-800 border-amber-400' : 'bg-slate-950/60 border-white/10 opacity-60'} flex items-center gap-4">
                                <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-white/10 flex items-center justify-center text-4xl shrink-0">
                                    ${unlocked ? t.icon : '🔒'}
                                </div>
                                <div>
                                    <span class="text-[11px] uppercase font-extrabold tracking-wider text-amber-300">${w.name}</span>
                                    <h4 class="font-display text-xl font-bold text-white">${t.name}</h4>
                                    <p class="text-sm text-slate-300">${t.desc}</p>
                                </div>
                            </div>
                        `;
                    }).join('');
                }).join('');

                content.innerHTML = `
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <h3 class="font-display text-2xl md:text-3xl font-bold text-amber-300">🏆 Álbum de Trofeos de Alfonso</h3>
                            <p class="text-slate-400 text-sm">Desbloqueados: ${this.state.unlockedTrophies.length} de 8</p>
                        </div>
                        <button onclick="app.closeModal()" class="btn-tactile w-11 h-11 rounded-2xl bg-slate-800 text-white font-bold text-xl border border-white/15">✕</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                        ${allTrophiesHtml}
                    </div>
                    <div class="text-center">
                        <button onclick="app.closeModal()" class="btn-tactile px-8 py-3.5 rounded-2xl bg-amber-400 text-slate-950 font-display font-bold text-lg border-b-4 border-amber-700">
                            ¡Seguir Jugando!
                        </button>
                    </div>
                `;

                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            }

            /**
             * MODAL: LIBRO DE TRUCOS DE 3.º DE PRIMARIA
             */
            openRulesBook() {
                sfx.playTap();
                const overlay = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');

                content.innerHTML = `
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="font-display text-2xl md:text-3xl font-bold text-sky-300">📖 Chuleta Mágica de 3.º</h3>
                        <button onclick="app.closeModal()" class="btn-tactile w-11 h-11 rounded-2xl bg-slate-800 text-white font-bold text-xl border border-white/15">✕</button>
                    </div>
                    <div class="space-y-4 text-slate-200">
                        <div class="p-4 rounded-2xl bg-emerald-950/50 border border-emerald-500/30">
                            <h4 class="font-display font-bold text-lg text-emerald-300 mb-1">🧱 Reglas de B/V y G/J</h4>
                            <p class="text-sm md:text-base">• Siempre <strong>B</strong> después de <strong>M</strong> (<em>tambor</em>) y delante de consonante (<em>brújula, bloque</em>).<br>• Con <strong>G</strong>: <em>ga, go, gu</em>. Si suena suave con E/I lleva U muda: <em>gue, gui</em> (<em>hoguera</em>). Si suena la U lleva diéresis: <em>güe, güi</em> (<em>pingüino</em>).</p>

                            <h4 class="font-display font-bold text-lg text-rose-300 mb-1">⚡ Reglas de H, LL/Y y R/RR</h4>
                            <p class="text-sm md:text-base">• Llevan <strong>H</strong> las palabras que empiezan por <em>hie-</em> y <em>hue-</em> (<em>hielo, huevo</em>) y los verbos <em>haber</em> y <em>hacer</em>.<br>• Se escribe <strong>RR</strong> solo entre vocales cuando suena fuerte (<em>torre</em>). Al principio (<em>roca</em>) o detrás de N/L/S (<em>Enrique</em>) va una sola R.</p>
                        </div>
                        <div class="p-4 rounded-2xl bg-purple-950/50 border border-purple-500/30">
                            <h4 class="font-display font-bold text-lg text-purple-300 mb-1">🔮 Tildes y C / Z / QU</h4>
                            <p class="text-sm md:text-base">• <strong>Agudas</strong> (fuerte al final): llevan tilde si acaban en vocal, N o S (<em>pudín, dragón</em>).<br>• <strong>Esdrújulas</strong> (antepenúltima fuerte): llevan tilde SIEMPRE (<em>mágico, rápido</em>).</p>
                        </div>
                        <div class="p-4 rounded-2xl bg-sky-950/50 border border-sky-500/30">

                            <p class="text-sm md:text-base">• Mayúscula al empezar, después de punto y en nombres propios.<br>• En español las preguntas y exclamaciones llevan signo al abrir y al cerrar: <strong>¿...?</strong> y <strong>¡...!</strong></p>
                        </div>
                    </div>
                    <div class="mt-6 text-center">
                        <button onclick="app.closeModal()" class="btn-tactile px-8 py-3.5 rounded-2xl bg-sky-400 text-slate-950 font-display font-bold text-lg border-b-4 border-sky-700">
                            ¡Listo!
                        </button>
                    </div>
                `;

                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            }

            closeModal() {
                sfx.playTap();
                const overlay = document.getElementById('modal-overlay');
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            }

            /**
             * PARTÍCULAS VISUALES DE CELEBRACIÓN
             */
            spawnCelebrationParticles(originEl) {
                const emojis = ['⭐', '✨', '⚡', '💎', '🔥'];
                const rect = originEl ? originEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                for (let i = 0; i < 14; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle text-2xl';
                    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    const angle = (Math.PI * 2 * i) / 14;
                    const dist = 70 + Math.random() * 90;
                    p.style.left = `${centerX}px`;
                    p.style.top = `${centerY}px`;
                    p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
                    p.style.setProperty('--ty', `${Math.sin(angle) * dist - 30}px`);
                    document.body.appendChild(p);
                    setTimeout(() => p.remove(), 1000);
                }
            }
        }

        // Arrancar la aplicación al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            window.app = new AventuraApp();
        });
    </script>
</body>
</html>
